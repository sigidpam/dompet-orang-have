<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>WEALTH // Secure Asset Kernel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto" x-data="wealthApp()">

    <!-- --- LOCK SCREEN MODAL --- -->
    <template x-if="!isUnlocked">
        <div class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
            <div class="border border-zinc-800 bg-zinc-950 p-6 w-full max-w-md text-center">
                <span class="text-xs font-mono text-amber-500 uppercase tracking-widest">Security Kernel Active</span>
                <h2 class="text-xl font-bold text-white mt-2 mb-6">Masukkan PIN Akses Lokal</h2>
                <form @submit.prevent="verifyPin" class="space-y-4">
                    <input type="password" x-model="enteredPin" maxlength="6" placeholder="PIN Anda (Default: 1234)" class="w-full bg-zinc-900 border border-zinc-800 
p-3 text-center text-xl tracking-widest text-white focus:outline-none focus:border-zinc-500 mono" required>
                    <p class="text-[11px] text-zinc-500">Aplikasi ini terkunci secara lokal demi privasi finansial Anda.</p>
                    <button type="submit" class="w-full bg-white text-black text-xs font-mono uppercase py-3 font-bold hover:bg-zinc-200 transition">Buka 
Kunci</button>
                </form>
            </div>
        </div>
    </template>

    <!-- --- MODAL GANTI PIN --- -->
    <template x-if="showPinModal">
        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
            <div class="border border-zinc-800 bg-zinc-950 p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
                    <h3 class="text-sm font-mono uppercase text-zinc-300">Ubah PIN Akses Lokal</h3>
                    <button @click="showPinModal = false" class="text-zinc-500 hover:text-white text-xs font-mono">[TUTUP]</button>
                </div>
                <form @submit.prevent="changePin" class="space-y-3">
                    <div>
                        <label class="text-[10px] font-mono text-zinc-500 uppercase">PIN Lama</label>
                        <input type="password" x-model="pinForm.oldPin" maxlength="6" required class="w-full bg-zinc-900 border border-zinc-800 p-2 text-sm text-white 
focus:outline-none mono">
                    </div>
                    <div>
                        <label class="text-[10px] font-mono text-zinc-500 uppercase">PIN Baru (Maks 6 digit)</label>
                        <input type="password" x-model="pinForm.newPin" maxlength="6" required class="w-full bg-zinc-900 border border-zinc-800 p-2 text-sm text-white 
focus:outline-none mono">
                    </div>
                    <div>
                        <label class="text-[10px] font-mono text-zinc-500 uppercase">Konfirmasi PIN Baru</label>
                        <input type="password" x-model="pinForm.confirmPin" maxlength="6" required class="w-full bg-zinc-900 border border-zinc-800 p-2 text-sm 
text-white focus:outline-none mono">
                    </div>
                    <button type="submit" class="w-full bg-amber-400 text-black text-xs font-mono uppercase py-2.5 font-bold hover:bg-amber-300 transition mt-2">Simpan 
PIN Baru</button>
                </form>
            </div>
        </div>
    </template>

    <!-- MAIN APP CONTENT -->
    <div :class="{'filter blur-sm select-none': !isUnlocked}">
        
        <!-- Header & Action Buttons -->
        <header class="border-b border-zinc-800 pb-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-zinc-500 font-mono">Secured PWA // v1.1.1</span>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mt-1">ASSET & CASHFLOW KERNEL</h1>
            </div>
            <div class="flex flex-wrap gap-2">
                <button @click="showPinModal = true" class="bg-zinc-900 border border-zinc-800 text-xs font-mono px-3 py-2 text-amber-400 hover:bg-zinc-800 
transition">🔒 Ganti PIN</button>
                <button @click="exportCSV" class="bg-zinc-900 border border-zinc-800 text-xs font-mono px-3 py-2 text-zinc-300 hover:bg-zinc-800 transition">📥 
Download CSV</button>
                <button @click="exportPDF" class="bg-zinc-900 border border-zinc-800 text-xs font-mono px-3 py-2 text-zinc-300 hover:bg-zinc-800 transition">🖨️ Cetak 
PDF</button>
                <button @click="shareData" class="bg-amber-400 text-black text-xs font-mono px-3 py-2 font-bold hover:bg-amber-300 transition">🔗 Share 
Ringkasan</button>
            </div>
        </header>

        <!-- PDF Area -->
        <div id="pdf-content" class="space-y-8">
            <!-- Grand Total Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="border border-zinc-800 bg-zinc-950 p-5">
                    <p class="text-xs font-mono text-zinc-500 uppercase">Grand Total Pendapatan</p>
                    <p class="text-2xl font-bold mono text-emerald-400 mt-2" x-text="formatIDR(summary.grand_total_pendapatan)"></p>
                </div>
                <div class="border border-zinc-800 bg-zinc-950 p-5">
                    <p class="text-xs font-mono text-zinc-500 uppercase">Pendapatan Investasi (Est/Bln)</p>
                    <p class="text-2xl font-bold mono text-amber-400 mt-2" x-text="formatIDR(summary.pendapatan_investasi?.est_monthly_return || 0)"></p>
                </div>
                <div class="border border-zinc-800 bg-zinc-950 p-5">
                    <p class="text-xs font-mono text-zinc-500 uppercase">Dana Liquid / Cash</p>
                    <p class="text-2xl font-bold mono text-blue-400 mt-2" x-text="formatIDR(summary.dana_liquid_cash)"></p>
                </div>
                <div class="border border-zinc-800 bg-zinc-950 p-5">
                    <p class="text-xs font-mono text-zinc-500 uppercase">Grand Total Pengeluaran</p>
                    <p class="text-2xl font-bold mono text-rose-400 mt-2" x-text="formatIDR(summary.grand_total_pengeluaran)"></p>
                </div>
            </div>

            <!-- Main Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left: Forms -->
                <div class="space-y-6">
                    <div class="border border-zinc-800 bg-zinc-950 p-5">
                        <h2 class="text-sm font-mono uppercase tracking-wider text-zinc-300 mb-4 border-b border-zinc-800 pb-2">+ Tambah Rekening</h2>
                        <form @submit.prevent="addAccount" class="space-y-3">
                            <input type="text" x-model="newAccount.name" placeholder="Nama (cth: BCA / Dompet)" required class="w-full bg-zinc-900 border 
border-zinc-800 p-2.5 text-sm text-white focus:outline-none">
                            <div class="grid grid-cols-2 gap-2">
                                <select x-model="newAccount.type" class="bg-zinc-900 border border-zinc-800 p-2.5 text-sm text-white focus:outline-none">
                                    <option value="bank">Bank</option>
                                    <option value="cash">Cash</option>
                                    <option value="e_wallet">E-Wallet</option>
                                </select>
                                <input type="text" x-model="newAccount.currency" placeholder="IDR / USD" required class="bg-zinc-900 border border-zinc-800 p-2.5 
text-sm text-white focus:outline-none">
                            </div>
                            <input type="number" x-model="newAccount.balance" placeholder="Saldo Awal" required class="w-full bg-zinc-900 border border-zinc-800 p-2.5 
text-sm text-white focus:outline-none">
                            <button type="submit" class="w-full bg-white text-black text-xs font-mono uppercase py-2.5 font-bold hover:bg-zinc-200">Simpan 
Rekening</button>
                        </form>
                    </div>

                    <div class="border border-zinc-800 bg-zinc-950 p-5">
                        <h2 class="text-sm font-mono uppercase tracking-wider text-zinc-300 mb-4 border-b border-zinc-800 pb-2">+ Pos Investasi</h2>
                        <form @submit.prevent="addInvestment" class="space-y-3">
                            <input type="text" x-model="newInv.name" placeholder="Nama Aset (cth: SBN / Saham)" required class="w-full bg-zinc-900 border 
border-zinc-800 p-2.5 text-sm text-white focus:outline-none">
                            <input type="text" x-model="newInv.category" placeholder="Tipe (Deposito/Saham/Crypto)" required list="inv-categories" class="w-full 
bg-zinc-900 border border-zinc-800 p-2.5 text-sm text-white focus:outline-none">
                            <datalist id="inv-categories">
                                <option value="Deposito"><option value="Saham"><option value="Reksa Dana"><option value="P2P Lending"><option value="Crypto">
                            </datalist>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" x-model="newInv.principal" placeholder="Modal Kotor" required class="bg-zinc-900 border border-zinc-800 p-2.5 
text-sm text-white focus:outline-none">
                                <input type="number" x-model="newInv.cashback" placeholder="Cashback" class="bg-zinc-900 border border-zinc-800 p-2.5 text-sm 
text-white focus:outline-none">
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <input type="number" step="0.01" x-model="newInv.annual_interest_rate" placeholder="Bunga%" class="bg-zinc-900 border border-zinc-800 
p-2.5 text-sm text-white focus:outline-none">
                                <input type="number" x-model="newInv.tenor_months" placeholder="Tenor" class="bg-zinc-900 border border-zinc-800 p-2.5 text-sm 
text-white focus:outline-none">
                                <input type="number" x-model="newInv.lots" placeholder="Lot" class="bg-zinc-900 border border-zinc-800 p-2.5 text-sm text-white 
focus:outline-none">
                            </div>
                            <input type="text" x-model="newInv.currency" placeholder="IDR / USD" required class="w-full bg-zinc-900 border border-zinc-800 p-2.5 
text-sm text-white focus:outline-none">
                            <button type="submit" class="w-full bg-amber-400 text-black text-xs font-mono uppercase py-2.5 font-bold hover:bg-amber-300">Tambah 
Portofolio</button>
                        </form>
                    </div>
                </div>

                <!-- Right: Tables -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="border border-zinc-800 bg-zinc-950 p-5">
                        <h2 class="text-sm font-mono uppercase tracking-wider text-zinc-300 mb-4 border-b border-zinc-800 pb-2">Portofolio Investasi & Return 
Aktif</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs mono">
                                <thead>
                                    <tr class="border-b border-zinc-800 text-zinc-500 uppercase">
                                        <th class="pb-2">Aset</th><th class="pb-2">Modal Net</th><th class="pb-2">Bunga/Cb</th><th class="pb-2 text-right">Est. 
Return/Bln</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-zinc-900">
                                    <template x-for="inv in summary.investments || []">
                                        <tr class="hover:bg-zinc-900/50">
                                            <td class="py-3">
                                                <div class="font-bold text-white" x-text="inv.name"></div>
                                                <div class="text-[10px] text-zinc-500" x-text="inv.category + ' • ' + inv.tenor_months + ' Bln • ' + inv.lots + ' 
Lot'"></div>
                                            </td>
                                            <td class="py-3" x-text="inv.currency + ' ' + formatNumber(inv.net_principal)"></td>
                                            <td class="py-3 text-zinc-400">
                                                <span x-text="inv.annual_interest_rate + '% p.a'"></span><br>
                                                <span class="text-[10px] text-emerald-400" x-text="'-' + inv.currency + ' ' + formatNumber(inv.cashback) + ' 
cb'"></span>
                                            </td>
                                            <td class="py-3 text-right text-amber-400 font-bold" x-text="inv.currency + ' ' + 
formatNumber(inv.estimated_monthly_return)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="border border-zinc-800 bg-zinc-950 p-5">
                        <h2 class="text-sm font-mono uppercase tracking-wider text-zinc-300 mb-4 border-b border-zinc-800 pb-2">Daftar Rekening & Cash</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <template x-for="acc in summary.accounts || []">
                                <div class="border border-zinc-900 bg-zinc-900/40 p-3 flex justify-between items-center">
                                    <div>
                                        <p class="text-xs font-bold text-white" x-text="acc.name"></p>
                                        <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 bg-zinc-800 text-zinc-400" x-text="acc.type"></span>
                                    </div>
                                    <p class="text-sm font-bold mono text-emerald-400" x-text="acc.currency + ' ' + formatNumber(acc.balance)"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function wealthApp() {
            return {
                isUnlocked: false,
                enteredPin: '',
                showPinModal: false,
                pinForm: { oldPin: '', newPin: '', confirmPin: '' },
                summary: {},
                newAccount: { name: '', type: 'bank', currency: 'IDR', balance: 0 },
                newInv: { name: '', category: 'Deposito', principal: 0, cashback: 0, annual_interest_rate: 6.0, tenor_months: 12, lots: 0, currency: 'IDR' },
                
                getStoredPin() {
                    return localStorage.getItem('app_local_pin') || '1234';
                },
                verifyPin() {
                    if (this.enteredPin === this.getStoredPin()) {
                        this.isUnlocked = true;
                    } else {
                        alert('PIN Salah!');
                        this.enteredPin = '';
                    }
                },
                changePin() {
                    if (this.pinForm.oldPin !== this.getStoredPin()) {
                        alert('PIN Lama salah!');
                        return;
                    }
                    if (this.pinForm.newPin !== this.pinForm.confirmPin) {
                        alert('Konfirmasi PIN baru tidak cocok!');
                        return;
                    }
                    if (this.pinForm.newPin.length < 4) {
                        alert('PIN minimal harus 4 digit!');
                        return;
                    }
                    localStorage.setItem('app_local_pin', this.pinForm.newPin);
                    alert('PIN berhasil diubah!');
                    this.showPinModal = false;
                    this.pinForm = { oldPin: '', newPin: '', confirmPin: '' };
                },
                async init() {
                    const res = await fetch('/api/dashboard/summary');
                    this.summary = await res.json();
                },
                async addAccount() {
                    await fetch('/api/accounts', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.newAccount) });
                    this.newAccount.name = ''; this.newAccount.balance = 0;
                    await this.init();
                },
                async addInvestment() {
                    await fetch('/api/investments', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.newInv) });
                    this.newInv.name = ''; this.newInv.principal = 0; this.newInv.cashback = 0;
                    await this.init();
                },
                exportCSV() {
                    window.location.href = '/api/export/csv';
                },
                exportPDF() {
                    const element = document.getElementById('pdf-content');
                    const opt = {
                        margin:       10,
                        filename:     'wealth_report.pdf',
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, backgroundColor: '#09090b' },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
                    };
                    html2pdf().from(element).set(opt).save();
                },
                async shareData() {
                    const text = `📊 Ringkasan Keuangan & Investasi:\n- Dana Liquid: ${this.formatIDR(this.summary.dana_liquid_cash)}\n- Est. Return Investasi/Bln: 
${this.formatIDR(this.summary.pendapatan_investasi?.est_monthly_return || 0)}\n- Total Pendapatan: ${this.formatIDR(this.summary.grand_total_pendapatan)}`;
                    if (navigator.share) {
                        try {
                            await navigator.share({ title: 'Wealth Report', text: text });
                        } catch (err) { console.log('Share dibatalkan'); }
                    } else {
                        navigator.clipboard.writeText(text);
                        alert('Ringkasan berhasil disalin ke clipboard untuk di-share!');
                    }
                },
                formatIDR(val) {
                    if (!val && val !== 0) return 'IDR 0';
                    return 'IDR ' + new Intl.NumberFormat('id-ID').format(val.toFixed(0));
                },
                formatNumber(val) {
                    if (!val && val !== 0) return '0';
                    return new Intl.NumberFormat('id-ID').format(val.toFixed(2));
                }
            }
        }
    </script>
</body>
</html>
