name: Update stock prices

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-prices
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and commit IDX snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch full quote board
        run: node scripts/fetch-stock-prices.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/stock-prices.json; then
            echo "No price change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-prices.json
          git commit -m "chore: update stock prices"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:main"
